schema: menu/v1
# Opened with land and from: "menu" (from the list, which it goes back to) or "command" (/land delete).
title:
  - kind: plain
    value:
      en: '<red>Deletion confirmation'
      fr: '<red>Confirmation de suppression'
size: 27
inputs:
  - name: land
    type: string
  - name: from
    type: string
  - name: info
    type: list
    source: { ref: "lands:land", params: { land: "{land}" } }
elements:
  # The ConfirmMenu of MSLands: confirm on the left, the question in the middle, cancel on the right.
  - id: confirm
    positions: "0-3,9-12,18-21"
    material: GREEN_STAINED_GLASS_PANE
    title:
      en: "<dark_green><bold>CONFIRM"
      fr: "<dark_green><bold>CONFIRMER"
    click:
      left:
        - lands:delete: { land: "{land}" }
        - close_menu
    states:
      - if:
          - expression: 'from == "menu"'
        material: GREEN_STAINED_GLASS_PANE
        title:
          en: "<dark_green><bold>CONFIRM"
          fr: "<dark_green><bold>CONFIRMER"
        click:
          left:
            - lands:delete: { land: "{land}" }
            - open_previous_menu
  - id: question
    positions: "4,13,22"
    material: GRAY_STAINED_GLASS_PANE
    title:
      en: "<yellow>Delete the land {info[0].name}?"
      fr: "<yellow>Voulez-vous supprimer le territoire {info[0].name} ?"
    lore:
      en:
        - "<red>Its chunks, permissions and bans are lost."
      fr:
        - "<red>Ses tronçons, permissions et bannissements sont perdus."
  - id: cancel
    positions: "5-8,14-17,23-26"
    material: RED_STAINED_GLASS_PANE
    title:
      en: "<dark_red><bold>CANCEL"
      fr: "<dark_red><bold>ANNULER"
    click:
      left:
        - close_menu
    states:
      - if:
          - expression: 'from == "menu"'
        material: RED_STAINED_GLASS_PANE
        title:
          en: "<dark_red><bold>CANCEL"
          fr: "<dark_red><bold>ANNULER"
        click:
          left:
            - open_previous_menu
