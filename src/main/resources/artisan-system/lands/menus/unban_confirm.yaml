schema: menu/v1
# Opened with land, target (a UUID) and target_name.
title:
  - kind: plain
    value:
      en: '<red>Unban confirmation'
      fr: '<red>Confirmation de débannissement'
size: 27
inputs:
  - name: land
    type: string
  - name: target
    type: string
  - name: target_name
    type: string
elements:
  # The ConfirmMenu of MSLands: confirm on the left, the question in the middle, cancel on the right.
  - id: confirm
    positions: "0-3,9-12,18-21"
    material: GREEN_STAINED_GLASS_PANE
    title:
      en: "<dark_green><bold>CONFIRM"
      fr: "<dark_green><bold>CONFIRMER"
    click:
      left:
        - lands:unban: { land: "{land}", player: "{target}" }
        - open_previous_menu
  - id: question
    positions: "4,13,22"
    material: GRAY_STAINED_GLASS_PANE
    title:
      en: "<yellow>Do you really want to unban {target_name}?"
      fr: "<yellow>Voulez-vous vraiment débannir {target_name} ?"
  - id: cancel
    positions: "5-8,14-17,23-26"
    material: RED_STAINED_GLASS_PANE
    title:
      en: "<dark_red><bold>CANCEL"
      fr: "<dark_red><bold>ANNULER"
    click:
      left:
        - open_previous_menu
