schema: menu/v1
# A land's trusted players for Java players who loaded the resource pack: the module's
# menus/trusts.yaml drawn with images. Same inputs, same clicks. The window is the image
# lands_list_background (vanilla_texture: false). The bottom row: the global and the guild
# permissions as buttons, Add as a green plus.
title:
  - kind: background
    asset_id: lands_list_background
  - kind: textarea
    value: { en: '{info[0].name} <#808080>></#808080> Permissions', fr: '{info[0].name} <#808080>></#808080> Permissions' }
    x: 88
    y: 6
    width: 168
    line_height: 10
    alignment: center
size: 54
vanilla_texture: false
inputs:
  - name: land
    type: string
  # Empty unless the viewer may manage the land.
  - name: info
    type: list
    source: { ref: "lands:land", params: { land: "{land}" } }
  - name: trusts
    type: list
    source: { ref: "lands:trusts", params: { land: "{land}" } }
elements:
  - id: land
    positions: "1-7"
    title: "<dark_green><bold>{info[0].name}"
  - id: trusts
    positions: "10-16,19-25,28-34,37-43"
    iterates: { source: trusts, alias: t }
    material: PLAYER_HEAD
    head: "playerhead:{t.name}"
    title: "<dark_green><bold>{t.name}"
    lore:
      en:
        - "<green>Left click to edit"
        - "<red>Right click to remove"
      fr:
        - "<green>Clic gauche pour éditer"
        - "<red>Clic droit pour supprimer"
    click:
      left:
        - open_menu: { menu_id: trust_edit, context: { land: "{land}", target: "{t.id}", group: "" } }
      right:
        - lands:untrust: { land: "{land}", target: "{t.id}" }
        - set_arg: { arg: refresh, value: "{t.id}" }
  # Two slots high each, on both sides of the list; greyed at its ends.
  - id: previous
    positions: "18,27"
    states:
      - if:
          - pagination_at_first: trusts
        image: { asset: lands_prev_off, fit: native }
        title: " "
    image: { asset: lands_prev, fit: native }
    title:
      en: "<yellow>Previous page"
      fr: "<yellow>Page précédente"
    click:
      left:
        - pagination_prev: trusts
  - id: next
    positions: "26,35"
    states:
      - if:
          - pagination_at_last: trusts
        image: { asset: lands_next_off, fit: native }
        title: " "
    image: { asset: lands_next, fit: native }
    title:
      en: "<yellow>Next page"
      fr: "<yellow>Page suivante"
    click:
      left:
        - pagination_next: trusts
  - id: back
    positions: "45"
    image: { asset: lands_back, fit: native }
    title:
      en: "<gray>Back"
      fr: "<gray>Retour"
    click:
      left:
        - open_previous_menu
  - id: global
    positions: "46-48"
    if:
      - expression: 'info.length() > 0'
    image: { asset: lands_button_plain, fit: native }
    label: { text: { en: "<white>Everyone", fr: "<white>Globales" }, offset_y: 1 }
    title:
      en: "<dark_green>Global permissions"
      fr: "<dark_green>Permissions globales"
    lore:
      en:
        - "<green>Permissions given"
        - "<green>to everyone."
      fr:
        - "<green>Permet de définir des permissions"
        - "<green>qui seront appliquées à tout le monde."
    click:
      left:
        - open_menu: { menu_id: trust_edit, context: { land: "{land}", target: "global", group: "" } }
  - id: guild
    positions: "49-51"
    if:
      - expression: 'info[0].guild_trust == "true"'
    image: { asset: lands_button_plain, fit: native }
    label: { text: { en: "<white>Guild", fr: "<white>Guilde" }, offset_y: 1 }
    title:
      en: "<dark_green>Guild permissions"
      fr: "<dark_green>Permissions de guilde"
    lore:
      en:
        - "<green>Permissions of the members"
        - "<green>of your guild."
      fr:
        - "<green>Permet de définir les permissions"
        - "<green>des membres de votre guilde."
    click:
      left:
        - open_menu: { menu_id: trust_edit, context: { land: "{land}", target: "guild", group: "" } }
  - id: add
    positions: "52"
    if:
      - expression: 'info.length() > 0'
    image: { asset: lands_add, fit: native }
    title:
      en: "<dark_green>Add"
      fr: "<dark_green>Ajouter"
    lore:
      en:
        - "<green>Add a player to edit their permissions."
      fr:
        - "<green>Permet d'ajouter un joueur pour éditer ses permissions."
    click:
      left:
        - open_dialog: { dialog_id: trust_add, context: { land: "{land}" } }
  - id: close
    positions: "53"
    image: { asset: lands_close, fit: native }
    title:
      en: "<red>Close"
      fr: "<red>Fermer"
    click:
      left:
        - close_menu
