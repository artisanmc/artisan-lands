schema: menu/v1
# The lands of a player, a guild, the server or a land (sub-lands), for Java players who loaded the
# resource pack: the module's menus/main.yaml drawn with images. Same inputs, same clicks. The window
# is the image lands_list_background (vanilla_texture: false): 28 lands a page instead of 14, the
# arrows on both sides of the list, the chunks used in a box at the bottom, Create a button.
# The images are drawn by tools/textured/generate.py.
title:
  - kind: background
    asset_id: lands_list_background
  - kind: textarea
    value: { en: '{scope == "sublands" ? "Sub-lands of " + parent_info[0].name : (scope == "guild" ? "Guild lands" : (scope == "system" ? "System lands" : "Your lands"))}', fr: '{scope == "sublands" ? "Sous-territoires de " + parent_info[0].name : (scope == "guild" ? "Territoires de guilde" : (scope == "system" ? "Territoires système" : "Vos territoires"))}' }
    x: 88
    y: 6
    width: 168
    line_height: 10
    alignment: center
size: 45
vanilla_texture: false
inputs:
  - name: scope
    type: string
  - name: owner
    type: string
  - name: parent
    type: string
  # Empty unless the viewer may manage these lands.
  - name: lands
    type: list
    source: { ref: "lands:lands", params: { scope: "{scope}", owner: "{owner}", parent: "{parent}" } }
  # One row for a player's or a guild's lands, none otherwise.
  - name: limits
    type: list
    source: { ref: "lands:limits", params: { scope: "{scope}", owner: "{owner}" } }
  # For sub-lands, the land they belong to (its name titles the menu).
  - name: parent_info
    type: list
    source: { ref: "lands:land", params: { land: "{parent}" } }
elements:
  - id: lands
    positions: "1-7,10-16,19-25,28-34"
    iterates: { source: lands, alias: l }
    material: PLAYER_HEAD
    head: "hdb:24064"
    title: "<dark_green>{l.name}"
    lore:
      en:
        - "<green>Left click to manage this land."
        - "<red>Right click to delete it."
        - ""
        - "<white>Chunks: {l.chunks}"
        - "<white>Trusted players: {l.trusts}"
        - "<white>Bans: {l.bans}"
      fr:
        - "<green>Clic gauche pour gérer ce territoire."
        - "<red>Clic droit pour supprimer ce territoire."
        - ""
        - "<white>Tronçons : {l.chunks}"
        - "<white>Joueurs trust : {l.trusts}"
        - "<white>Bannissements : {l.bans}"
    click:
      left:
        - open_menu: { menu_id: manage, context: { land: "{l.id}" } }
      right:
        - open_menu: { menu_id: delete_confirm, context: { land: "{l.id}", from: "menu" } }
  # Two slots high each, on both sides of the list; greyed at its ends.
  - id: previous
    positions: "9,18"
    states:
      - if:
          - pagination_at_first: lands
        image: { asset: lands_prev_off, fit: native }
        title: " "
    image: { asset: lands_prev, fit: native }
    title:
      en: "<yellow>Previous page"
      fr: "<yellow>Page précédente"
    click:
      left:
        - pagination_prev: lands
  - id: next
    positions: "17,26"
    states:
      - if:
          - pagination_at_last: lands
        image: { asset: lands_next_off, fit: native }
        title: " "
    image: { asset: lands_next, fit: native }
    title:
      en: "<yellow>Next page"
      fr: "<yellow>Page suivante"
    click:
      left:
        - pagination_next: lands
  # Back only for sub-lands (opened from their land); /lands opens this menu first.
  - id: back
    positions: "36"
    if:
      - expression: 'scope == "sublands"'
    image: { asset: lands_back, fit: native }
    title:
      en: "<gray>Back"
      fr: "<gray>Retour"
    click:
      left:
        - open_previous_menu
  # A player's or a guild's lands: the chunks used, in a box (the value is the label).
  - id: limits
    positions: "37-39"
    if:
      - expression: 'limits.length() > 0'
    image: { asset: lands_chunks_count, fit: native }
    label: { text: "<white>{limits[0].used}<gray>/{limits[0].max}", offset_x: 5 }
    title:
      en: "<yellow>Chunks used: <white>{limits[0].used}<gray>/{limits[0].max}"
      fr: "<yellow>Tronçons utilisés : <white>{limits[0].used}<gray>/{limits[0].max}"
    lore:
      en:
        - '{limits[0].guild == "true" ? "<gray>To buy guild claims, use /guildclaims" : ""}'
      fr:
        - '{limits[0].guild == "true" ? "<gray>Pour acheter des claims de guilde, utilisez /guildclaims" : ""}'
  - id: create
    positions: "41-43"
    image: { asset: lands_button, fit: native }
    label: { text: { en: "<white>Create", fr: "<white>Créer" }, offset_y: 1 }
    title:
      en: "<dark_green>Create"
      fr: "<dark_green>Créer"
    lore:
      en:
        - "<green>Create a new land."
      fr:
        - "<green>Permet de créer un nouveau territoire"
    click:
      left:
        - open_dialog: { dialog_id: create, context: { scope: "{scope}", owner: "{owner}", parent: "{parent}" } }
  - id: close
    positions: "44"
    image: { asset: lands_close, fit: native }
    title:
      en: "<red>Close"
      fr: "<red>Fermer"
    click:
      left:
        - close_menu
