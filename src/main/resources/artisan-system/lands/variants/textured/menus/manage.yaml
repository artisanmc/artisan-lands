schema: menu/v1
# A land's menu for Java players who loaded the resource pack: the module's menus/manage.yaml drawn
# with images. Same inputs, same clicks. The window is the image lands_hub_background
# (vanilla_texture: false); the land's name is the title, its hover the area under it. Each entry
# is a card over 3x2 slots, its name the card's label (the dark grey of a window's title), short
# enough for the card's 50 pixels (Droits, Réglages, Parcelles); the tooltip keeps the full name. The
# bottom row: the land's chunks and trusted players in boxes.
title:
  - kind: background
    asset_id: lands_hub_background
  - kind: textarea
    value: { en: '{info[0].name}', fr: '{info[0].name}' }
    x: 88
    y: 6
    width: 168
    line_height: 10
    alignment: center
size: 54
vanilla_texture: false
inputs:
  - name: land
    type: string
  # Empty unless the viewer may manage the land.
  - name: info
    type: list
    source: { ref: "lands:land", params: { land: "{land}" } }
elements:
  # The land's name at the top is a title text: this element (no image, no item) is an invisible
  # area under it that shows the land on hover.
  - id: land
    positions: "1-7"
    title: "<dark_green><bold>{info[0].name}"
    lore:
      en:
        - "<white>Chunks: {info[0].chunks}"
        - "<white>Trusted players: {info[0].trusts}"
        - "<white>Bans: {info[0].bans}"
      fr:
        - "<white>Tronçons : {info[0].chunks}"
        - "<white>Joueurs trust : {info[0].trusts}"
        - "<white>Bannissements : {info[0].bans}"
  # A land's chunks; for a sub-land, its area (selected in the world, the menu closes).
  - id: claims
    positions: "9-11,18-20"
    if:
      - expression: 'info.length() > 0'
    states:
      - if:
          - expression: 'info[0].area_set == "true"'
        image: { asset: lands_card_selection, fit: native }
        label: { text: { en: "<#404040>Area", fr: "<#404040>Zone" }, offset_y: 8 }
        title:
          en: "<dark_green>Protected area:"
          fr: "<dark_green>Zone protégée :"
        lore:
          en:
            - "<gray>Server: {info[0].area_server}"
            - "<gray>World: x: {info[0].area_world}"
            - "<gray>Position 1: {info[0].area_pos1}"
            - "<gray>Position 2: {info[0].area_pos2}"
            - "<green>Click to define the area again."
          fr:
            - "<gray>Serveur : {info[0].area_server}"
            - "<gray>Monde : x: {info[0].area_world}"
            - "<gray>Position 1 : {info[0].area_pos1}"
            - "<gray>Position 2 : {info[0].area_pos2}"
            - "<green>Cliquez pour redéfinir la zone protégée."
        click:
          left:
            - close_menu
            - lands:select_cuboid: { land: "{land}" }
      - if:
          - expression: 'info[0].area_elsewhere == "true"'
        image: { asset: lands_card_selection, fit: native }
        label: { text: { en: "<#404040>Area", fr: "<#404040>Zone" }, offset_y: 8 }
        title:
          en: "<dark_green>Protected area:"
          fr: "<dark_green>Zone protégée :"
        lore:
          en:
            - "<red>Defined on the server {info[0].area_server}"
            - "<green>Click to define the area here."
          fr:
            - "<red>Défini sur le serveur : {info[0].area_server}"
            - "<green>Cliquez pour définir la zone protégée."
        click:
          left:
            - close_menu
            - lands:select_cuboid: { land: "{land}" }
      - if:
          - expression: 'info[0].subland == "true"'
        image: { asset: lands_card_selection, fit: native }
        label: { text: { en: "<#404040>Area", fr: "<#404040>Zone" }, offset_y: 8 }
        title:
          en: "<dark_green>Protected area:"
          fr: "<dark_green>Zone protégée :"
        lore:
          en:
            - "<red>Not defined"
            - "<green>Click to define the area."
          fr:
            - "<red>Non définie"
            - "<green>Cliquez pour définir la zone protégée."
        click:
          left:
            - close_menu
            - lands:select_cuboid: { land: "{land}" }
    image: { asset: lands_card_chunks, fit: native }
    label: { text: { en: "<#404040>Chunks", fr: "<#404040>Tronçons" }, offset_y: 8 }
    title:
      en: "<dark_green>Protected chunks"
      fr: "<dark_green>Tronçons protégés"
    lore:
      en:
        - "<green>Manage the chunks this land includes."
      fr:
        - "<green>Permet de gérer les tronçons que le territoire inclut."
    click:
      left:
        - open_menu: { menu_id: claims, context: { land: "{land}" } }
  - id: trusts
    positions: "12-14,21-23"
    if:
      - expression: 'info.length() > 0'
    image: { asset: lands_card_permissions, fit: native }
    label: { text: { en: "<#404040>Access", fr: "<#404040>Droits" }, offset_y: 8 }
    title:
      en: "<dark_green>Permissions"
      fr: "<dark_green>Permissions"
    lore:
      en:
        - "<green>Manage who may do what in the land."
      fr:
        - "<green>Permet de gérer les permissions du territoire."
    click:
      left:
        - open_menu: { menu_id: trusts, context: { land: "{land}" } }
  - id: settings
    positions: "15-17,24-26"
    if:
      - expression: 'info.length() > 0'
    image: { asset: lands_card_settings, fit: native }
    label: { text: { en: "<#404040>Settings", fr: "<#404040>Réglages" }, offset_y: 8 }
    title:
      en: "<dark_green>Settings"
      fr: "<dark_green>Paramètres"
    lore:
      en:
        - "<green>Change the land's settings."
      fr:
        - "<green>Permet de modifier les paramètres du territoire."
    click:
      left:
        - open_menu: { menu_id: settings, context: { land: "{land}" } }
  - id: bans
    positions: "27-29,36-38"
    if:
      - expression: 'info.length() > 0'
    image: { asset: lands_card_bans, fit: native }
    label: { text: { en: "<#404040>Bans", fr: "<#404040>Bannis" }, offset_y: 8 }
    title:
      en: "<dark_green>Bans"
      fr: "<dark_green>Bannissements"
    lore:
      en:
        - "<green>Manage the banned players."
      fr:
        - "<green>Permet de gérer les bannissements."
    click:
      left:
        - open_menu: { menu_id: bans, context: { land: "{land}" } }
  - id: sublands
    positions: "30-32,39-41"
    if:
      - expression: 'info[0].can_sublands == "true"'
    image: { asset: lands_card_sublands, fit: native }
    label: { text: { en: "<#404040>Plots", fr: "<#404040>Parcelles" }, offset_y: 8 }
    title:
      en: "<dark_green>Sub-lands"
      fr: "<dark_green>Sous-territoires"
    lore:
      en:
        - "<green>Manage the sub-lands."
        - "<gray>Cuboid lands inside the chunks"
        - "<gray>this land protects."
      fr:
        - "<green>Permet de gérer les sous-territoires."
        - "<gray>Ils servent à définir des territoires cuboïdes à"
        - "<gray>l'intérieur des chunks protégés par le territoire."
    click:
      left:
        - open_menu: { menu_id: main, context: { scope: "sublands", owner: "", parent: "{land}" } }
  # The links also open from the settings, as in the module's menus; here they get the last card.
  - id: links
    positions: "33-35,42-44"
    if:
      - expression: 'info.length() > 0'
    image: { asset: lands_card_links, fit: native }
    label: { text: { en: "<#404040>Links", fr: "<#404040>Liens" }, offset_y: 8 }
    title:
      en: "<dark_green>Links"
      fr: "<dark_green>Liens"
    lore:
      en:
        - "<green>Share permissions or bans with your other lands."
      fr:
        - "<green>Permet de définir des liens avec vos autres territoires."
    click:
      left:
        - open_menu: { menu_id: links, context: { land: "{land}" } }
  - id: back
    positions: "45"
    image: { asset: lands_back, fit: native }
    title:
      en: "<gray>Back"
      fr: "<gray>Retour"
    click:
      left:
        - open_previous_menu
  - id: chunk_count
    positions: "46-48"
    if:
      - expression: 'info.length() > 0'
    image: { asset: lands_chunks_count, fit: native }
    label: { text: "<white>{info[0].chunks}", offset_x: 5 }
    title:
      en: "<yellow>Chunks: <white>{info[0].chunks}"
      fr: "<yellow>Tronçons : <white>{info[0].chunks}"
  - id: trust_count
    positions: "50-52"
    if:
      - expression: 'info.length() > 0'
    image: { asset: lands_trusts_count, fit: native }
    label: { text: "<white>{info[0].trusts}", offset_x: 5 }
    title:
      en: "<yellow>Trusted players: <white>{info[0].trusts}"
      fr: "<yellow>Joueurs trust : <white>{info[0].trusts}"
    lore:
      en:
        - "<gray>Bans: <white>{info[0].bans}"
      fr:
        - "<gray>Bannissements : <white>{info[0].bans}"
  - id: close
    positions: "53"
    image: { asset: lands_close, fit: native }
    title:
      en: "<red>Close"
      fr: "<red>Fermer"
    click:
      left:
        - close_menu
